                shortDesc: '香港最早期的六層高「H型」徙置大廈，標誌著香港公共房屋政策的開端。',

                history: `1953年12月25日聖誕夜，石硤尾木屋區發生浩劫性大火，導致超過5萬名居民流離失所。港英政府為迅速安置災民，於1954年興建首批共8座六層高的「徙置大廈」，美荷樓（當時稱為第15座）便是其中之一。`,
                architecturalDetail: `「H型」建築的設計極具實用考量：兩條長型翼樓為住戶單位，兩翼中間由一條橫樑連接。這條中間橫樑集中設置了所有住戶共用的洗手間、浴室及公共水龍頭，有效節省建造時間與管道成本。外廊式的走廊除了連接各單位，更是居民日常生活社交的重要空間。`,

                history: `在50至60年代，美荷樓每層的中間橫樑設有男女公共廁所和浴室。早期廁所甚至沒有安裝門板，僅有低矮隔板，衛生條件十分惡劣。`,

                questions: [

            {
                id: 'spot-5',
                title: '1970年代改建連通單位',
                category: '居住變遷',
                floor: '1/F 展館',
                lat: 22.33410,
                lng: 114.16380,
                mapX: 72,
                mapY: 40,
                badge: '演變對比',
                shortDesc: '兩房打通合併，配備獨立廚廁、彩色電視機與家庭手工業。',
                image: 'https://upload.wikimedia.org/wikipedia/commons/d/de/%E6%85%88%E9%9B%B2%E5%B1%B1%E9%82%A8_Tsz_Wan_Shan_Estate%2C_1960s.jpg',
                fallbackImg: 'https://placehold.co/800x500/2C3E50/ffffff?text=1970年代改建單位復原',
                history: `到了1970年代，政府推行「十年建屋計劃」，美荷樓亦進行了大規模改建（改建計劃）。將兩個相連的50年代小單位打通合併為一個較大單位，並加裝獨立廁所和廚房露台。`,
                architecturalDetail: `單位內鋪設了流行地磚（如綠白相間花磚），家庭電器如黑白/彩色電視機、鐵扇、縫紉機（裁縫機）開始普及。當時許多家庭在室內做「穿膠花」、「剪線頭」等家庭手工業，補貼家計，展現勤勞拚搏精神。`,
                questions: [
                    '對比50年代與70年代單位，生活品質有了哪些飛躍性的提升？',
                    '觀察70年代單位內的客廳，找出一件代表當時香港家庭工業發展的物件（如縫紉機或膠花材料）。'
                ]
            },
            {
                id: 'spot-6',
                title: '昔日公屋傳統「士多」雜貨店',
                category: '社區經濟',
                floor: '1/F 社區展示區',
                lat: 22.33415,
                lng: 114.16390,
                mapX: 82,
                mapY: 65,
                badge: '懷舊特色',

                image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/2013-08_HK_MoH_47.JPG/960px-2013-08_HK_MoH_47.JPG',
                fallbackImg: 'https://placehold.co/800x500/D96B27/ffffff?text=美荷樓懷舊士多展區',
                history: `在未有大型連鎖超級市場的年代，「士多」（Grocery Store）是公屋居民的生命線。士多老闆熟悉每家每戶，甚至提供「賒帳」（記帳）服務，待居民發薪日再結清。`,
                architecturalDetail: `士多門口擺放大玻璃瓶裝汽水箱（如維他奶、可口可樂）、紅白藍膠袋、玻璃唧唧糖罐、山楂餅和西瓜波（塑膠足球）。士多不僅是買東西的地方，也是居民留留言、借電話、傳遞消息的資訊中心。`,
                questions: [
                    '現代超級市場與昔日「士多」相比，在人情味和社區連結上有所不同嗎？',
                    '拍照記錄士多展區中最吸引你的一樣懷舊物品，並說明它的用途。'

            },
            {
                id: 'spot-7',
                title: '活化項目：YHA 美荷樓青年旅舍與四美咖啡館',
                category: '歷史活化',
                floor: '地面中庭 / 旅舍',
                lat: 22.33370,
                lng: 114.16385,
                mapX: 50,
                mapY: 88,
                badge: '現代保育',
                shortDesc: '獲保育為二級歷史建築，轉型為國際青年旅舍，結合歷史展覽與現代休閒。',
                image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Mei_Ho_House_Fullcup_Cafe_201505.jpg/960px-Mei_Ho_House_Fullcup_Cafe_201505.jpg',
                fallbackImg: 'https://placehold.co/800x500/2A5A44/ffffff?text=美荷樓青年旅舍中庭',
                history: `美荷樓是石硤尾邨第一期唯一留存下來的徙置大廈。2008年被納入發展局「活化歷史建築夥伴計劃」第一期，由香港青年旅舍協會（YHA）成功活化。`,
                architecturalDetail: `2013年正式揭幕，轉型為「YHA美荷樓青年旅舍」及「美荷樓生活館」。保育項目完整保留了H型大廈的外貌結構、原裝鋼窗與經典綠色大門，並引入四美咖啡館及文化創意空間，讓舊建築在新時代煥發新生。`,
                questions: [
                    '將舊大廈直接拆卸重建與「活化保育」相比，各自有何利弊？',
                    '作為中小學生，你認為如何能讓更多同齡人關心香港的歷史建築保育？'
                ]
            }
        ];

        // ==========================================
        // 雲端數據庫配置（Supabase）
        // 註冊 https://supabase.com 建立項目後：
        //   1. 在 SQL Editor 執行建表腳本（見項目說明）
        //   2. 在 Authentication 建立教師帳號（郵箱對應下方 teacherEmail，密碼即「統一管理密碼」）
        //   3. 把 Project URL 與 anon key 填入下方 → 自動切換為雲端模式
        // 留空則使用「本機演示模式」（資料僅存於當前瀏覽器）。
        // ==========================================
        const SUPABASE_CONFIG = {
            url: '',
            anonKey: '',
            teacherEmail: 'teacher@meiho.hk'
        };
        const DEMO_TEACHER_PASSWORD = 'meiho2026'; // 僅「本機演示模式」的教師密碼

        // 圖片壓縮：發表作品前把照片壓至 800px 內，減少數據庫體積
        const compressImage = (dataUrl, maxSize = 800, quality = 0.72) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                try {
                    let width = img.naturalWidth;
                    let height = img.naturalHeight;
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                } catch (e) {
                    resolve(dataUrl); // 畫布被跨域污染等情況，退回原圖
                }
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });

        // 作品數據層：自動在「雲端 Supabase」與「本機演示」之間切換
        const WorkStore = (() => {
            const LS_WORKS = 'meiho_works_demo_v1';
            const LS_TEACHER = 'meiho_teacher_demo_v1';
            let client = null;

            const isCloud = () => Boolean(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey && window.supabase && window.supabase.createClient);
            const getClient = () => {
                if (!client) client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
                return client;
            };
            const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_WORKS) || '[]'); } catch (e) { return []; } };
            const lsSet = (arr) => { try { localStorage.setItem(LS_WORKS, JSON.stringify(arr)); } catch (e) { console.error('本機儲存失敗', e); } };

            return {
                mode: () => (isCloud() ? 'cloud' : 'demo'),

                // 學生發表作品（新作品一律為 pending，待教師審閱）
                async submitWork(work) {
                    if (isCloud()) {
                        const { error } = await getClient().from('works').insert(work);
                        if (error) throw error;
                    } else {
                        const arr = lsGet();
                        arr.unshift({ id: 'w-' + Date.now(), created_at: new Date().toISOString(), ...work, status: 'pending', grade: '', comment: '', featured: false });
                        lsSet(arr);
                    }
                },

                // 已發表作品（訪客可見）
                async listPublished() {
                    if (isCloud()) {
                        const { data, error } = await getClient().from('works').select('*').eq('status', 'published').order('created_at', { ascending: false });
                        if (error) throw error;
                        return data || [];
                    }
                    return lsGet().filter(w => w.status === 'published');
                },

                // 全部作品（教師批閱用，需登入）
                async listAll() {
                    if (isCloud()) {
                        const { data, error } = await getClient().from('works').select('*').order('created_at', { ascending: false });
                        if (error) throw error;
                        return data || [];
                    }
                    return lsGet();
                },

                // 教師登入：雲端模式用 Supabase Auth（統一管理密碼），演示模式校對預設密碼
                async signIn(password) {
                    if (isCloud()) {
                        const { error } = await getClient().auth.signInWithPassword({ email: SUPABASE_CONFIG.teacherEmail, password: password });
                        if (error) throw error;
                    } else {
                        if (password !== DEMO_TEACHER_PASSWORD) throw new Error('密碼錯誤');
                        localStorage.setItem(LS_TEACHER, '1');
                    }
                },

                async signOut() {
                    if (isCloud()) { try { await getClient().auth.signOut(); } catch (e) { /* 忽略 */ } }
                    localStorage.removeItem(LS_TEACHER);
                },

                async isTeacher() {
                    if (isCloud()) {
                        try {
                            const { data } = await getClient().auth.getSession();
                            return Boolean(data && data.session);
                        } catch (e) { return false; }
                    }
                    return localStorage.getItem(LS_TEACHER) === '1';
                },

                // 教師批閱：更新評級/評語/精選/狀態
                async reviewWork(id, patch) {
                    const payload = { ...patch, reviewed_at: new Date().toISOString() };
                    if (isCloud()) {
                        const { error } = await getClient().from('works').update(payload).eq('id', id);
                        if (error) throw error;
                    } else {
                        const arr = lsGet();
                        const idx = arr.findIndex(w => w.id === id);
                        if (idx >= 0) { arr[idx] = { ...arr[idx], ...payload }; lsSet(arr); }
                    }
                },

                async deleteWork(id) {
                    if (isCloud()) {
                        const { error } = await getClient().from('works').delete().eq('id', id);
                        if (error) throw error;
                    } else {
                        lsSet(lsGet().filter(w => w.id !== id));
                    }
                }
            };
        })();

        // 統一作品資料格式（雲端 snake_case 欄位 / 本機皆可）
        const normalizeWork = (w) => ({
            id: w.id,
            createdAt: w.created_at || w.createdAt || new Date().toISOString(),
            studentName: w.student_name || w.studentName || '匿名',
            className: w.class_name || w.className || '',
            studentNo: w.student_no || w.studentNo || '',
            school: w.school || '',
            spotId: w.spot_id || w.spotId || '',
            spotTitle: w.spot_title || w.spotTitle || '',
            photo: w.photo || '',
            reflection: w.reflection || '',
            status: w.status || 'pending',
            grade: w.grade || '',
            comment: w.comment || '',
            featured: Boolean(w.featured)
        });

        const formatDateTime = (iso) => {
            try {
                return new Date(iso).toLocaleString('zh-HK', { hour12: false }).slice(0, 16);

        // WGS-84 轉 GCJ-02（高德座標系），避免真實座標在高德地圖上偏移
        function wgs84ToGcj02(lat, lng) {
            const a = 6378245.0, ee = 0.00669342162296594323;
            function transformLat(x, y) {
                let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
                ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
                ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
                return ret;
            }
            function transformLng(x, y) {
                let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
                ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
                ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
                return ret;
            }
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * Math.PI;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            return [lat + dLat, lng + dLng];
        }

        function MapView({ spots, studentLogs, onSelectSpot, progressPercent, completedCount, totalSpots }) {
            const [filterCategory, setFilterCategory] = React.useState('ALL');
            const [mapMode, setMapMode] = React.useState('real'); // 'real'（高德真實地圖）或 'floorplan'（H型平面圖）
            const mapContainerRef = React.useRef(null);
            const amapInstance = React.useRef(null);
            const amapMarkers = React.useRef([]);
            const amapInfoWindow = React.useRef(null);

            const filteredSpots = filterCategory === 'ALL' 
                ? spots 
                : spots.filter(s => s.category === filterCategory);

            // 真實地圖生命週期：掛載時建立一次，組件卸載（切換分頁）時銷毀。
            // 地圖容器常駐掛載（僅以 CSS hidden 切換顯示），React 不增刪容器，
            // 徹底避免「切換模式/分頁後重複地圖圖標」與 removeChild 崩潰。
            React.useEffect(() => {
                try {
                    if (!mapContainerRef.current) return undefined;

                    // 中心點：石硤尾美荷樓（WGS-84 轉 GCJ-02 後）
                    const map = new AMap.Map(mapContainerRef.current, {
                        center: wgs84ToGcj02(22.33395, 114.16371).reverse(), // AMap 格式：[經度, 緯度]
                        zoom: 18,
                        resizeEnable: true,
                        dragEnable: true,
                        zoomEnable: true,
                        doubleClickZoom: true,
                        touchZoom: true
                    });
                    amapInstance.current = map;

                    amapInfoWindow.current = new AMap.InfoWindow({
                        isCustom: false,
                        anchor: 'bottom-center',
                        offset: new AMap.Pixel(0, -16)
                    });

                    return () => {
                        try {
                            if (map.clearMap) map.clearMap();
                            map.destroy();
                        } catch (e) {
                            // 容器已隨組件卸載被移除時，忽略銷毀異常
                        }
                        amapInstance.current = null;
                        amapInfoWindow.current = null;
                        amapMarkers.current = [];
                    };
                } catch (e) {
                    console.error('地圖初始化失敗', e);
                    return undefined;
                }
            }, []);

            // 景點標記：依 spots 與打卡狀態刷新（每次先清空舊標記，避免重複圖標）
            React.useEffect(() => {
                try {
                const map = amapInstance.current;
                const infoWindow = amapInfoWindow.current;
                if (!map || !infoWindow) return;

                if (amapMarkers.current.length) {
                    map.remove(amapMarkers.current);
                    amapMarkers.current = [];
                }
                infoWindow.close();

                spots.forEach((spot, idx) => {
                    const isDone = studentLogs[spot.id]?.completed;

                        <div style="background-color: ${isDone ? '#16a34a' : '#B83227'}; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 12px; cursor: pointer;">
                            ${isDone ? '✓' : idx + 1}
                        </div>
                    `;
                    const dotEl = dot.firstElementChild;
                    const marker = new AMap.Marker({
                        position: wgs84ToGcj02(spot.lat, spot.lng).reverse(),
                        content: dotEl,
                        anchor: 'center',
                        map: map
                    });

                    // 以原生 DOM 事件綁定，確保點擊可靠觸發
                    dotEl.addEventListener('click', () => {
                        infoWindow.setContent(`
                            <div style="text-align: center; font-family: sans-serif; padding: 2px; min-width: 180px;">
                                <b style="font-size: 13px; color: #8B1E15;">#${idx + 1} ${spot.title}</b><br/>
                                <span style="font-size: 11px; color: #666;">${spot.floor}</span><br/>

                                    查看研學導賞
                                </button>
                            </div>
                        `);
                        infoWindow.open(map, marker.getPosition());
                        const btn = document.getElementById(`btn-spot-${spot.id}`);
                        if (btn) {
                            btn.onclick = () => onSelectSpot(spot);
                        }
                    });

                    amapMarkers.current.push(marker);
                });

                // 從平面圖切回真實地圖時，通知地圖重新檢查容器尺寸
                if (mapMode === 'real') {
                    window.dispatchEvent(new Event('resize'));
                }
                } catch (e) {
                    console.error('地圖標記刷新失敗', e);
                }

            return (
                <div className="space-y-6 animate-fadeIn">

                                美荷樓實地考察指南
                            </span>
                            <h2 className="text-2xl sm:text-3xl font-bold mb-2">石硤尾美荷樓 — 真實地圖與實地導賞</h2>
                            <p className="text-sm sm:text-base text-red-100 mb-4 leading-relaxed">
                                歡迎來到九龍深水埗巴域街美荷樓！請點擊下方<span className="text-yellow-300 font-semibold">真實高德地圖地標</span>或<span className="text-yellow-300 font-semibold">景點卡片</span>，深入了解美荷樓的建築特徵、1953年大火歷史與徙置區生活。
                            </p>
                            
                            {/* 進度條 */}
                            <div className="bg-black/20 p-3 rounded-xl border border-white/20 max-w-lg">
                                <div className="flex justify-between text-xs mb-1">
                                    <span>實地研學打卡進度</span>
                                    <span className="font-bold text-yellow-300">{completedCount} / {totalSpots} 個景點 ({progressPercent}%)</span>
                                </div>
                                <div className="w-full bg-black/30 h-3 rounded-full overflow-hidden p-0.5">
                                    <div 
                                        className="bg-yellow-400 h-full rounded-full transition-all duration-500 shadow-inner"
                                        style={{ width: `${progressPercent}%` }}
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 地圖區域與景點列表中間分欄 */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* 左側：地圖展示 (7 Cols) */}
                        <div className="lg:col-span-7 bg-white rounded-2xl shadow-md border border-meiho-sand p-4 flex flex-col">
                            <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                <h3 className="font-bold text-meiho-slate text-base sm:text-lg flex items-center">
                                    <i className="fa-solid fa-map text-meiho-orange mr-2"></i>
                                    {mapMode === 'real' ? '美荷樓高德地圖真實實景地圖' : '美荷樓「H型」結構與展區平面示意圖'}
                                </h3>
                                
                                {/* 地圖模式切換 */}
                                <div className="flex bg-slate-100 p-1 rounded-lg text-xs">
                                    <button

                            {/* 地圖容器常駐且 className 靜態（React 不改寫，避免覆蓋 AMap 注入的類別）；
                                平面圖以 hidden 切換，覆蓋在地圖上方 */}
                            <div className="relative w-full h-80 sm:h-[420px] rounded-xl border-2 border-meiho-sand overflow-hidden shadow-inner">
                                <div ref={mapContainerRef} className="w-full h-full"></div>

                                        {spots.map((spot, idx) => {

                                <div key={idx} className="relative pl-6 sm:pl-8 group">
                                    <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-meiho-red border-2 border-white shadow"></div>
                                    
                                    <div className="bg-meiho-cream p-4 rounded-xl border border-meiho-sand hover:border-meiho-orange transition">
                                        <span className="text-xs font-bold text-meiho-orange bg-orange-100 px-2 py-0.5 rounded">
                                            {item.year}
                                        </span>
                                        <h4 className="font-bold text-base text-meiho-slate mt-1 mb-1">{item.title}</h4>
                                        <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">{item.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 歷史圖解名詞卡片 */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-meiho-sand space-y-2">
                            <div className="w-10 h-10 rounded-xl bg-red-100 text-meiho-red flex items-center justify-center font-bold text-lg">
                                <i className="fa-solid fa-fire"></i>
                            </div>
                            <h4 className="font-bold text-base text-slate-800">1. 徙置區 (Resettlement Estate)</h4>
                            <p className="text-xs text-slate-600 leading-relaxed">
                                指港英政府為急需安置災民及木屋區居民而興建的早期廉租房屋。當時設計以快速興建、極簡成本為核心考量。
                            </p>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-meiho-sand space-y-2">
                            <div className="w-10 h-10 rounded-xl bg-orange-100 text-meiho-orange flex items-center justify-center font-bold text-lg">
                                <i className="fa-solid fa-cubes"></i>
                            </div>
                            <h4 className="font-bold text-base text-slate-800">2. H 型大廈結構 (H-Block)</h4>
                            <p className="text-xs text-slate-600 leading-relaxed">
                                第一代徙置大廈經典外型。兩翼為住戶房間，中間橫樑集中設置浴室與水龍頭，兼具結構穩定性與公用設施便利性。
                            </p>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-meiho-sand space-y-2">
                            <div className="w-10 h-10 rounded-xl bg-green-100 text-meiho-green flex items-center justify-center font-bold text-lg">
                                <i className="fa-solid fa-recycle"></i>
                            </div>
                            <h4 className="font-bold text-base text-slate-800">3. 活化歷史建築</h4>
                            <p className="text-xs text-slate-600 leading-relaxed">
                                將具有歷史價值的舊建築進行結構修復與功能改造，賦予其全新社會使命（如美荷樓改為旅舍與生活館）。
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 分享天地：學生作品展示（公開）+ 教師批閱通道（密碼登入）
        // ==========================================
        const STATUS_META = {
            pending: { label: '待審閱', cls: 'bg-amber-100 text-amber-800 border-amber-300' },
            published: { label: '已發表', cls: 'bg-green-100 text-green-800 border-green-300' },
            rejected: { label: '已駁回', cls: 'bg-slate-100 text-slate-500 border-slate-300' }
        };
        const GRADE_OPTIONS = [
            { v: 'A+', label: 'A+ 特優 · 觀察深刻獨到' },
            { v: 'A', label: 'A 優良 · 內容完整詳實' },
            { v: 'B', label: 'B 合格 · 完成基本答題' },
            { v: 'C', label: 'C 須改善 · 答案過於簡略' }
        ];

        function GalleryWorkCard({ w }) {
            return (
                <div className="bg-white rounded-2xl shadow-sm border border-meiho-sand overflow-hidden flex flex-col">
                    <div className="h-44 bg-slate-100 relative">
                        {w.photo ? (
                            <img src={w.photo} alt="作品照片" className="w-full h-full object-cover" />
                        ) : (
                            <div className="w-full h-full flex items-center justify-center text-slate-300"><i className="fa-solid fa-image text-3xl"></i></div>
                        )}
                        {w.featured && (
                            <span className="absolute top-2 right-2 bg-yellow-400 text-meiho-darkred text-[10px] font-bold px-2 py-1 rounded-full shadow">★ 精選作品</span>
                        )}
                    </div>
                    <div className="p-4 space-y-2 flex-1 flex flex-col">
                        <div className="flex justify-between items-center gap-2">
                            <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded line-clamp-1">{w.spotTitle}</span>
                            <span className="text-[10px] text-slate-400 whitespace-nowrap">{formatDateTime(w.createdAt)}</span>
                        </div>
                        <h4 className="font-bold text-sm text-meiho-slate">{w.studentName} · {w.className}</h4>
                        <p className="text-xs text-slate-600 whitespace-pre-line leading-relaxed flex-1">{w.reflection}</p>
                        {(w.grade || w.comment) && (
                            <div className="pt-2 border-t border-meiho-sand/60 space-y-1.5">
                                {w.grade && (
                                    <span className="inline-block text-[10px] bg-meiho-red text-white font-bold px-2 py-0.5 rounded-full">教師評分：{w.grade}</span>
                                )}
                                {w.comment && (
                                    <p className="text-[11px] text-amber-800 bg-amber-50 border-l-4 border-amber-400 px-2 py-1.5 rounded-r-lg italic leading-relaxed">
                                        <i className="fa-solid fa-comment-dots mr-1"></i>{w.comment}
                                    </p>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AdminWorkCard({ w, edit, onEdit, onSave, onPublish, onReject, onDelete }) {
            const meta = STATUS_META[w.status] || STATUS_META.pending;
            return (
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-meiho-sand space-y-3">
                    <div className="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-2">
                        <div className="flex flex-wrap items-center gap-2">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${meta.cls}`}>{meta.label}</span>
                            <span className="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">{w.spotTitle}</span>
                            {w.featured && <span className="text-[10px] bg-yellow-400 text-meiho-darkred font-bold px-2 py-0.5 rounded-full">★ 精選</span>}
                        </div>
                        <span className="text-[10px] text-slate-400">{formatDateTime(w.createdAt)}{w.school ? ` · ${w.school}` : ''}</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-4">
                        <div className="sm:col-span-4">
                            <div className="h-36 rounded-xl overflow-hidden bg-slate-100 border border-slate-200 mb-2">
                                {w.photo ? (
                                    <img src={w.photo} alt="作品照片" className="w-full h-full object-cover" />
                                ) : (
                                    <div className="w-full h-full flex items-center justify-center text-slate-300"><i className="fa-solid fa-image text-2xl"></i></div>
                                )}
                            </div>
                            <p className="text-xs font-bold text-meiho-darkred">{w.studentName}</p>
                            <p className="text-[11px] text-slate-500">{w.className}{w.studentNo ? ` · ${w.studentNo}號` : ''}</p>
                        </div>

                        <div className="sm:col-span-8 space-y-3">
                            <div className="bg-meiho-cream p-3 rounded-xl border border-meiho-sand text-xs leading-relaxed text-slate-700 max-h-32 overflow-y-auto custom-scrollbar">
                                <p className="font-bold text-meiho-darkred mb-1"><i className="fa-solid fa-quote-left mr-1 opacity-50"></i>學生反思：</p>
                                <p className="whitespace-pre-line">{w.reflection}</p>
                            </div>

                            {/* 批閱控制項 */}
                            <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 space-y-2">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 items-end">
                                    <div>
                                        <label className="text-[11px] text-amber-800 block mb-1">評定級別：</label>
                                        <select
                                            value={edit.grade}
                                            onChange={(e) => onEdit({ grade: e.target.value })}
                                            className="w-full bg-white border border-amber-300 rounded-lg p-2 text-xs font-bold text-meiho-red focus:outline-none"
                                        >
                                            <option value="">未評分</option>
                                            {GRADE_OPTIONS.map(g => <option key={g.v} value={g.v}>{g.label}</option>)}
                                        </select>
                                    </div>
                                    <label className="flex items-center text-xs text-amber-900 cursor-pointer pb-2">
                                        <input
                                            type="checkbox"
                                            checked={edit.featured}
                                            onChange={(e) => onEdit({ featured: e.target.checked })}
                                            className="mr-1.5 rounded text-meiho-red focus:ring-meiho-orange"
                                        />
                                        設為優質精選作品
                                    </label>
                                </div>
                                <textarea
                                    rows="2"
                                    placeholder="教師評語與指導建議（審閱通過後會展示給學生與訪客）..."
                                    value={edit.comment}
                                    onChange={(e) => onEdit({ comment: e.target.value })}
                                    className="w-full p-2 border border-amber-300 rounded-lg text-xs focus:outline-none bg-white"
                                ></textarea>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={onSave} className="bg-meiho-slate hover:bg-slate-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                                        <i className="fa-solid fa-floppy-disk mr-1"></i>儲存批閱
                                    </button>
                                    {w.status !== 'published' && (
                                        <button onClick={onPublish} className="bg-green-600 hover:bg-green-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                                            <i className="fa-solid fa-globe mr-1"></i>通過並公開發表
                                        </button>
                                    )}
                                    {w.status !== 'rejected' && (
                                        <button onClick={onReject} className="bg-slate-200 hover:bg-slate-300 text-slate-600 text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                                            <i className="fa-solid fa-rotate-left mr-1"></i>駁回（不公開）
                                        </button>
                                    )}
                                    <button onClick={onDelete} className="bg-red-50 hover:bg-red-100 text-red-600 text-[11px] font-bold px-3 py-1.5 rounded-lg transition ml-auto">
                                        <i className="fa-solid fa-trash mr-1"></i>刪除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ShareView({ showToast }) {
            const [view, setView] = React.useState('gallery'); // gallery | admin
            const [works, setWorks] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [isTeacher, setIsTeacher] = React.useState(false);
            const [showLogin, setShowLogin] = React.useState(false);
            const [pw, setPw] = React.useState('');
            const [pwBusy, setPwBusy] = React.useState(false);
            const [pwError, setPwError] = React.useState('');
            const [filter, setFilter] = React.useState('pending');
            const [edits, setEdits] = React.useState({});
            const dbMode = WorkStore.mode();

            const load = async () => {
                setLoading(true);
                try {
                    const teacher = await WorkStore.isTeacher();
                    setIsTeacher(teacher);
                    const data = teacher ? await WorkStore.listAll() : await WorkStore.listPublished();
                    const normalized = data.map(normalizeWork);
                    setWorks(normalized);
                    const init = {};
                    normalized.forEach(w => { init[w.id] = { grade: w.grade, comment: w.comment, featured: w.featured }; });
                    setEdits(init);
                } catch (e) {
                    console.error('讀取作品失敗', e);
                    showToast('❌ 讀取作品失敗：' + (e.message || '未知錯誤'));
                }
                setLoading(false);
            };

            React.useEffect(() => { load(); }, []);

            const handleLogin = async () => {
                if (!pw.trim()) return;
                setPwBusy(true);
                setPwError('');
                try {
                    await WorkStore.signIn(pw);
                    setShowLogin(false);
                    setPw('');
                    showToast('✅ 驗證成功，已進入教師批閱後台');
                    await load();
                    setView('admin');
                } catch (e) {
                    console.error(e);
                    setPwError('密碼錯誤或登入失敗，請重試');
                }
                setPwBusy(false);
            };

            const handleLogout = async () => {
                await WorkStore.signOut();
                setIsTeacher(false);
                setView('gallery');
                showToast('已退出教師通道');
                await load();
            };

            const saveReview = async (w, extra) => {
                const e = edits[w.id] || { grade: w.grade, comment: w.comment, featured: w.featured };
                try {
                    await WorkStore.reviewWork(w.id, { grade: e.grade, comment: e.comment, featured: e.featured, ...extra });
                    showToast('✅ 批閱已儲存');
                    await load();
                } catch (err) {
                    console.error(err);
                    showToast('❌ 儲存失敗：' + (err.message || '未知錯誤'));
                }
            };

            const handleDelete = async (w) => {
                if (!window.confirm(`確定要永久刪除 ${w.studentName} 的這份作品嗎？`)) return;
                try {
                    await WorkStore.deleteWork(w.id);
                    showToast('已刪除該作品');
                    await load();
                } catch (err) {
                    console.error(err);
                    showToast('❌ 刪除失敗：' + (err.message || '未知錯誤'));
                }
            };

            const pendingCount = works.filter(w => w.status === 'pending').length;
            const publishedCount = works.filter(w => w.status === 'published').length;
            const featuredCount = works.filter(w => w.status === 'published' && w.featured).length;
            const shownWorks = view === 'admin'
                ? (filter === 'all' ? works : works.filter(w => w.status === filter))
                : works.filter(w => w.status === 'published');

            return (
                <div className="space-y-6 animate-fadeIn">
                    {/* 頂部標頭 */}
                    <div className="bg-meiho-darkred text-white p-5 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span className="bg-yellow-400 text-meiho-darkred text-xs px-2.5 py-1 rounded font-bold uppercase">
                                分享天地
                            </span>
                            <h2 className="text-2xl font-bold mt-1">學生研學作品展示與教師批閱</h2>
                            <p className="text-xs text-red-100">
                                {dbMode === 'cloud'
                                    ? '已連接雲端數據庫，作品多設備即時同步；教師批閱通過後公開發表。'
                                    : '目前為本機演示模式，作品僅保存在此瀏覽器（接入 Supabase 後即為雲端多設備同步）。'}
                            </p>
                        </div>
                        <div className="flex flex-wrap justify-center gap-2 no-print">
                            <span className={`text-[11px] px-3 py-2 rounded-xl font-bold border ${dbMode === 'cloud' ? 'bg-green-500/20 text-green-200 border-green-400/40' : 'bg-yellow-500/20 text-yellow-100 border-yellow-400/40'}`}>
                                <i className={dbMode === 'cloud' ? 'fa-solid fa-cloud mr-1' : 'fa-solid fa-flask mr-1'}></i>
                                {dbMode === 'cloud' ? '雲端已連接' : '本機演示模式'}
                            </span>
                            {isTeacher && (
                                <React.Fragment>
                                    <button
                                        onClick={() => setView('gallery')}
                                        className={`font-bold text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center space-x-2 ${view === 'gallery' ? 'bg-yellow-400 text-meiho-darkred' : 'bg-white/10 text-white hover:bg-white/20 border border-white/30'}`}
                                    >
                                        <i className="fa-solid fa-images"></i>
                                        <span>作品展示</span>
                                    </button>
                                    <button
                                        onClick={() => setView('admin')}
                                        className={`relative font-bold text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center space-x-2 ${view === 'admin' ? 'bg-yellow-400 text-meiho-darkred' : 'bg-white/10 text-white hover:bg-white/20 border border-white/30'}`}
                                    >
                                        <i className="fa-solid fa-pen-ruler"></i>
                                        <span>批閱後台</span>
                                        {pendingCount > 0 && (
                                            <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">{pendingCount}</span>
                                        )}
                                    </button>
                                    <button
                                        onClick={handleLogout}
                                        className="bg-white text-meiho-darkred font-bold text-xs px-4 py-2.5 rounded-xl shadow hover:bg-slate-100 transition flex items-center space-x-2"
                                    >
                                        <i className="fa-solid fa-right-from-bracket"></i>
                                        <span>退出</span>
                                    </button>
                                </React.Fragment>
                            )}
                            {!isTeacher && (
                                <button
                                    onClick={() => setShowLogin(true)}
                                    className="bg-white text-meiho-darkred font-bold text-xs px-4 py-2.5 rounded-xl shadow hover:bg-slate-100 transition flex items-center space-x-2"
                                >
                                    <i className="fa-solid fa-lock"></i>
                                    <span>教師通道</span>
                                </button>
                            )}
                        </div>
                    </div>

                    {loading ? (
                        <div className="bg-white p-12 rounded-2xl border border-dashed border-slate-300 text-center">
                            <i className="fa-solid fa-spinner fa-spin text-3xl text-meiho-orange"></i>
                            <p className="text-xs text-slate-400 mt-3">正在讀取作品…</p>
                        </div>
                    ) : view === 'admin' && isTeacher ? (
                        /* 教師批閱後台 */
                        <div className="space-y-4">
                            <div className="grid grid-cols-3 gap-3">
                                <div className="bg-white p-4 rounded-2xl border border-amber-200 text-center shadow-sm">
                                    <p className="text-2xl font-black text-amber-600">{pendingCount}</p>
                                    <p className="text-[11px] text-slate-500 font-bold">待審閱</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border border-green-200 text-center shadow-sm">
                                    <p className="text-2xl font-black text-green-600">{publishedCount}</p>
                                    <p className="text-[11px] text-slate-500 font-bold">已發表</p>
                                </div>
                                <div className="bg-white p-4 rounded-2xl border border-yellow-200 text-center shadow-sm">
                                    <p className="text-2xl font-black text-yellow-500">{featuredCount}</p>
                                    <p className="text-[11px] text-slate-500 font-bold">精選作品</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-2">
                                {[['pending', '待審閱'], ['published', '已發表'], ['rejected', '已駁回'], ['all', '全部']].map(([k, label]) => (
                                    <button
                                        key={k}
                                        onClick={() => setFilter(k)}
                                        className={`text-xs font-bold px-4 py-2 rounded-xl border transition ${filter === k ? 'bg-meiho-red text-white border-meiho-red shadow' : 'bg-white text-slate-600 border-slate-200 hover:border-meiho-orange'}`}
                                    >
                                        {label}{k === 'pending' && pendingCount > 0 ? ` (${pendingCount})` : ''}
                                    </button>
                                ))}
                            </div>

                            {shownWorks.length === 0 ? (
                                <div className="bg-white p-12 rounded-2xl border border-dashed border-slate-300 text-center space-y-2">
                                    <i className="fa-solid fa-inbox text-4xl text-slate-300"></i>
                                    <h4 className="font-bold text-slate-600 text-base">此分類暫無作品</h4>
                                    <p className="text-xs text-slate-400 max-w-md mx-auto">學生在「學習手冊」點擊「發表作品到分享天地」後，作品會出現在這裡等待批閱。</p>
                                </div>
                            ) : (
                                shownWorks.map(w => (
                                    <AdminWorkCard
                                        key={w.id}
                                        w={w}
                                        edit={edits[w.id] || { grade: w.grade, comment: w.comment, featured: w.featured }}
                                        onEdit={(patch) => setEdits(prev => ({ ...prev, [w.id]: { ...(prev[w.id] || { grade: w.grade, comment: w.comment, featured: w.featured }), ...patch } }))}
                                        onSave={() => saveReview(w, {})}
                                        onPublish={() => saveReview(w, { status: 'published' })}
                                        onReject={() => saveReview(w, { status: 'rejected' })}
                                        onDelete={() => handleDelete(w)}
                                    />
                                ))
                            )}
                        </div>
                    ) : (
                        /* 公開作品展示牆 */
                        shownWorks.length === 0 ? (
                            <div className="bg-white p-12 rounded-2xl border border-dashed border-slate-300 text-center space-y-3">
                                <i className="fa-solid fa-photo-film text-4xl text-slate-300"></i>
                                <h4 className="font-bold text-slate-600 text-base">暫時還沒有已發表的作品</h4>
                                <p className="text-xs text-slate-400 max-w-md mx-auto">
                                    請前往「學生拍照打卡與反思手冊」填寫反思，然後點擊「發表作品到分享天地」。作品經教師審閱批改後會在此展示。
                                </p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {shownWorks.map(w => <GalleryWorkCard key={w.id} w={w} />)}
                            </div>
                        )
                    )}

                    {/* 教師登入彈窗 */}
                    {showLogin && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn" onClick={() => setShowLogin(false)}>
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl border border-meiho-sand" onClick={(e) => e.stopPropagation()}>
                                <div className="text-center">
                                    <div className="w-12 h-12 mx-auto bg-meiho-red rounded-full flex items-center justify-center text-white">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="font-bold text-lg text-meiho-slate mt-2">教師批閱通道</h3>
                                    <p className="text-xs text-slate-500">請輸入統一管理密碼進入批閱後台</p>
                                </div>
                                <input
                                    type="password"
                                    value={pw}
                                    autoFocus
                                    onChange={(e) => setPw(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleLogin(); }}
                                    placeholder="管理密碼"
                                    className="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-meiho-orange text-center tracking-widest"
                                />
                                {pwError && (
                                    <p className="text-xs text-red-600 text-center"><i className="fa-solid fa-circle-exclamation mr-1"></i>{pwError}</p>
                                )}
                                {dbMode === 'demo' && (
                                    <p className="text-[11px] text-slate-400 text-center">演示模式預設密碼：{DEMO_TEACHER_PASSWORD}</p>
                                )}
                                <div className="flex space-x-2">
                                    <button onClick={() => setShowLogin(false)} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">取消</button>
                                    <button onClick={handleLogin} disabled={pwBusy} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-meiho-red text-white hover:bg-meiho-darkred transition disabled:opacity-60">
                                        {pwBusy ? '驗證中…' : '登入'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SpotDetailModal({ spot, studentLog, onClose, onSave }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto animate-fadeIn">
                    <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl border border-meiho-sand flex flex-col">
                        
                        {/* 頂部圖片大圖 */}
                        <div className="relative h-60 sm:h-72 w-full bg-slate-900">
                            <img 
                                src={spot.image} 
                                alt={spot.title}
                                onError={(e) => { e.target.src = spot.fallbackImg; }}
                                className="w-full h-full object-cover opacity-90"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                            
                            <button 
                                onClick={onClose}
                                className="absolute top-4 right-4 bg-black/60 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-meiho-red transition text-sm"
                            >
                                ✕
                            </button>

                            <div className="absolute bottom-4 left-4 right-4 text-white">
                                <span className="bg-meiho-orange text-white text-[10px] font-bold px-2 py-0.5 rounded mr-2">
                                    {spot.category}
                                </span>
                                <span className="text-xs text-slate-300">{spot.floor}</span>
                                <h3 className="text-xl sm:text-2xl font-bold mt-1">{spot.title}</h3>
                            </div>
                        </div>

                        {/* 詳細內容 */}
                        <div className="p-6 space-y-6 flex-1">
                            <div className="space-y-3">
                                <h4 className="font-bold text-base text-meiho-slate border-b border-meiho-sand pb-1 flex items-center">
                                    <i className="fa-solid fa-landmark text-meiho-red mr-2"></i>
                                    歷史背景與建築意義
                                </h4>
                                <p className="text-xs sm:text-sm text-slate-700 leading-relaxed bg-meiho-cream p-3 rounded-xl border border-meiho-sand">
                                    {spot.history}
                                </p>

                                <h4 className="font-bold text-base text-meiho-slate border-b border-meiho-sand pb-1 flex items-center pt-2">
                                    <i className="fa-solid fa-house-chimney-window text-meiho-orange mr-2"></i>
                                    建築特徵與現場觀察點
                                </h4>
                                <p className="text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    {spot.architecturalDetail}
                                </p>
                            </div>

                            {/* 思考引導 */}
                            <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 space-y-2">
                                <h4 className="font-bold text-xs text-amber-900 flex items-center">
                                    <i className="fa-solid fa-lightbulb text-amber-500 mr-2"></i>
                                    研學思考引導問題：
                                </h4>
                                <ul className="list-disc list-inside text-xs text-amber-800 space-y-1">
                                    {spot.questions.map((q, idx) => (
                                        <li key={idx}>{q}</li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        {/* 底部按鈕 */}
                        <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-between items-center">
                            <span className="text-xs text-slate-500">
                                {studentLog?.completed ? '✅ 你已完成此景點的打卡' : '💡 請切換至「手冊」分頁填寫個人反思'}
                            </span>
                            <button 
                                onClick={onClose}
                                className="bg-meiho-slate text-white text-xs font-bold px-5 py-2.5 rounded-xl hover:bg-slate-700 transition"
                            >
                                關閉視窗
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
